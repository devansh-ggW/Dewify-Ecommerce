<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEWIFY — Product Ad Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f4f2ed;font-family:'DM Sans',sans-serif}.wrap{max-width:1500px;margin:auto;padding:42px 24px 80px}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:38px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#96948e}.head h1{font:700 clamp(42px,6vw,78px)/.9 'Space Grotesk';letter-spacing:-.065em;margin:10px 0}.head p{max-width:500px;color:#aaa79f;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:26px}.unit{min-width:0}.ad{aspect-ratio:4/5;background:#111;position:relative;overflow:hidden;border:1px solid #252525;border-radius:4px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}.ad:before{content:'';position:absolute;inset:-25%;background:radial-gradient(circle at 70% 22%,var(--glow),transparent 34%),radial-gradient(circle at 20% 80%,rgba(255,255,255,.07),transparent 30%);z-index:-2}.ad:after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,transparent 35%,rgba(0,0,0,.78));z-index:-1}.top{display:flex;justify-content:space-between;align-items:start}.badge{font-size:10px;letter-spacing:.16em;border:1px solid rgba(255,255,255,.3);padding:8px 10px}.num{font-size:10px;color:#85827c;letter-spacing:.15em}.visual{position:absolute;left:12%;right:12%;top:20%;height:47%;display:flex;align-items:center;justify-content:center}.visual img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 24px 28px rgba(0,0,0,.45));border-radius:3px}.visual .placeholder{font:600 26px/1 'Space Grotesk';text-align:center;letter-spacing:-.04em;color:#e8e5de;max-width:75%}.bottom{position:relative;z-index:2}.kicker{font-size:10px;letter-spacing:.16em;color:#aaa79f;margin-bottom:10px}.name{font:700 clamp(25px,3vw,38px)/.95 'Space Grotesk';letter-spacing:-.055em;max-width:90%;margin-bottom:14px}.pitch{color:#c4c1ba;font-size:13px;line-height:1.45;max-width:88%;margin:0 0 17px}.row{display:flex;justify-content:space-between;align-items:end;border-top:1px solid rgba(255,255,255,.18);padding-top:14px}.price{font:600 23px 'Space Grotesk'}.cta{font-size:10px;letter-spacing:.13em}.save{width:100%;margin-top:9px;padding:12px;background:#f3f1eb;color:#080808;border:0;font:700 11px 'DM Sans';letter-spacing:.12em;cursor:pointer}.save:hover{opacity:.88}@media(max-width:650px){.wrap{padding:28px 14px 60px}.head{display:block}.grid{grid-template-columns:1fr}.ad{padding:24px}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="eyebrow">DEWIFY / AD STUDIO</div><h1>STOP THE SCROLL.</h1></div><p>11 ready-to-export product creatives built from the current DEWIFY catalogue. Each creative is a standalone 4:5 social-ad layout with the live storefront product image, price, badge and a short selling angle.</p></header><section class="grid" id="grid"></section></main>
<script>
const P=[
['dw-storage-vault','FoldAway Storage Vault','₹799','SMART PICK','Make the clutter disappear.','Utility','#74624e','https://maqsood.me/cdn/shop/files/Product_Content_77.jpg?v=1785268495'],
['dw-witchlight','Witchlight Gothic Hat Lamp','₹1,499','LIMITED','Set the room to a different mood.','Utility','#5e456e','https://oss-cf.cjdropshipping.com/product/2026/07/04/08/08fcf3b3-a6bf-4e84-b942-996b9b5d9f5d.jpeg'],
['dw-heatcore-jacket','HeatCore USB Heated Jacket','₹2,499','WINTER','Cold outside. Heat stays with you.','Wear','#7b4b35','https://cf.cjdropshipping.com/17000928/1725075714115506176.jpg'],
['dw-moonglow-pendant','MoonGlow Luminous Pendant','₹699','GLOW','A little light for your everyday fit.','Wear','#5a618d','https://cf.cjdropshipping.com/16367616/1636808394162.jpg'],
['dw-fruity-paws','Fruity Paws Cozy Hoodie','₹799','PET PICK','Tiny fit. Big cozy energy.','Pet','#7b5b43','https://images.pet-friends.co.kr/storage/pet_friends/product/id/8/d/5/8/f/4/a/8d58f4aa400cf3ca2b8494f5d6a20b2c/10000/19ba6e25823b48338a8231aaaff13f24.jpg'],
['dw-bunnyglow','BunnyGlow Touch Night Light','₹1,299','SOFT GLOW','Tap. Glow. Chill.','Utility','#b78a5b','https://cf.cjdropshipping.com/17154720/2405120725050328100.jpg'],
['dw-orbitmoon-lamp','OrbitMoon Crystal Night Lamp','₹899','AMBIENT','Bring a little universe indoors.','Utility','#495c82','https://cf.cjdropshipping.com/17116704/2403290157100327000.jpg'],
['dw-temptrack-bottle','TempTrack Insulated Bottle','₹1,099','DAILY USE','Your everyday drink, upgraded.','Utility','#466b68','https://cf.cjdropshipping.com/17032032/1738098783004266496.jpg'],
['dw-cloudwarm-socks','CloudWarm Over-Knee Socks','₹899','COZY','Cold days just got softer.','Wear','#755e58','https://cf.cjdropshipping.com/17051904/2401140356490329800.jpg'],
['dw-ravenhide-watch','RavenHide Retro Leather Watch','₹1,299','CLASSIC','Old-school character. Everyday wear.','Wear','#57463d','https://cf.cjdropshipping.com/1620710794428.jpg?x-oss-process=image%2Fresize%2Cm_fill%2Cm_pad%2Cw_1200%2Ch_1200'],
['dw-pup-match-vest','PupMatch Sports Vest','₹699','PET PICK','Game-day energy for your pup.','Pet','#5b6872','https://furrinn.com/cdn/shop/files/IMG_4311.jpg?v=1749623987']
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grid=document.getElementById('grid');
P.forEach((p,i)=>{const unit=document.createElement('div');unit.className='unit';unit.innerHTML=`<article class="ad" id="ad-${p[0]}" style="--glow:${p[6]}"><div class="top"><span class="badge">${esc(p[3])}</span><span class="num">DW / ${String(i+1).padStart(2,'0')}</span></div><div class="visual"><img src="${p[7]}" alt="${esc(p[1])}" referrerpolicy="no-referrer"><div class="placeholder" hidden>${esc(p[1])}</div></div><div class="bottom"><div class="kicker">DEWIFY / ${esc(p[5])}</div><div class="name">${esc(p[1])}</div><p class="pitch">${esc(p[4])}</p><div class="row"><span class="price">${esc(p[2])}</span><span class="cta">SHOP DEWIFY ↗</span></div></div></article><button class="save" data-id="${p[0]}">DOWNLOAD AD / PNG</button>`;grid.appendChild(unit);const img=unit.querySelector('img');img.onerror=()=>{img.hidden=true;unit.querySelector('.placeholder').hidden=false};});
document.addEventListener('click',async e=>{const b=e.target.closest('.save');if(!b)return;const el=document.getElementById('ad-'+b.dataset.id);b.disabled=true;b.textContent='RENDERING…';try{const canvas=await html2canvas(el,{scale:2,backgroundColor:'#111',useCORS:true,allowTaint:false});const a=document.createElement('a');a.download='dewify-'+b.dataset.id+'-ad.png';a.href=canvas.toDataURL('image/png');a.click();}catch(err){alert('Could not export this ad in this browser. Right-click the ad and save a screenshot instead.')}finally{b.disabled=false;b.textContent='DOWNLOAD AD / PNG'}});
</script></body></html>
