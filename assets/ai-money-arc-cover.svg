<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f7e8b5"/><stop offset=".26" stop-color="#d4ae58"/><stop offset=".65" stop-color="#a97724"/><stop offset="1" stop-color="#f0d58a"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#92b66e"/><stop offset=".5" stop-color="#315e37"/><stop offset="1" stop-color="#12291b"/>
  </linearGradient>
  <radialGradient id="vignette"><stop offset="0" stop-color="#243728" stop-opacity=".46"/><stop offset="1" stop-color="#060806" stop-opacity="0"/></radialGradient>
  <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
    <circle cx="5" cy="9" r=".8" fill="#fff" opacity=".035"/>
    <circle cx="31" cy="28" r=".65" fill="#d7b86b" opacity=".035"/>
    <circle cx="17" cy="39" r=".55" fill="#fff" opacity=".022"/>
  </pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<title id="title">The AI Money Arc</title>
<desc id="desc">A dark golden and deep green old-money inspired guide to AI and modern income.</desc>

<rect width="1024" height="1536" fill="#070907"/>
<rect width="1024" height="1536" fill="url(#vignette)"/>
<rect width="1024" height="1536" fill="url(#grain)"/>
<rect x="42" y="42" width="940" height="1452" fill="none" stroke="#9f762e" stroke-width="2"/>
<rect x="58" y="58" width="908" height="1420" fill="none" stroke="#315438" stroke-opacity=".62"/>
<path d="M82 118H942" stroke="#b58a3c" stroke-opacity=".45"/>
<text x="82" y="105" fill="#d8c18a" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="8">DEWIFY / PRIVATE EDITION</text>
<text x="942" y="105" text-anchor="end" fill="#72856f" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="4">LEARN / BUILD / EARN / GROW</text>

<!-- ornate crest -->
<g transform="translate(512 254)">
  <circle r="96" fill="#0d150f" stroke="#a77e35" stroke-width="2"/>
  <circle r="75" fill="none" stroke="#516a4e" stroke-opacity=".72"/>
  <path d="M-39 18L-12 -11L12 8L45 -35L35 -36L50 -59L54 -29L32 -38L42 -38L12 5L-13 -10L-35 9Z" fill="url(#gold)"/>
  <path d="M-57 45Q0 76 57 45" fill="none" stroke="#a77e35" stroke-width="2"/>
  <text y="112" text-anchor="middle" fill="#8da083" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="4">MODERN WEALTH / DIGITAL ERA</text>
</g>

<text x="512" y="476" text-anchor="middle" fill="#f1ede2" font-family="Georgia,Times New Roman,serif" font-size="42" letter-spacing="14">THE</text>
<text x="512" y="596" text-anchor="middle" fill="#f2efe7" font-family="Georgia,Times New Roman,serif" font-size="94" font-weight="600" letter-spacing="1">AI MONEY</text>
<text x="512" y="730" text-anchor="middle" fill="url(#gold)" font-family="Georgia,Times New Roman,serif" font-size="150" font-weight="600" letter-spacing="12">ARC</text>
<path d="M214 770H430M594 770H810" stroke="#a57b32" stroke-width="2" opacity=".75"/>
<circle cx="512" cy="770" r="4" fill="#d3b15f"/>

<text x="512" y="842" text-anchor="middle" fill="#d9d5c9" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="5">LEARN AI. BUILD REAL SKILLS. CREATE LEVERAGE.</text>

<!-- old-money ledger card -->
<g transform="translate(170 930)" filter="url(#shadow)">
  <rect width="684" height="262" rx="10" fill="#0c110d" stroke="#596d53"/>
  <rect x="18" y="18" width="648" height="226" rx="6" fill="none" stroke="#2e4c31"/>
  <text x="42" y="62" fill="#ae9964" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="5">THE PLAYBOOK</text>
  <text x="42" y="112" fill="#ede8dc" font-family="Georgia,serif" font-size="32">Knowledge → Skill → Asset</text>
  <path d="M42 140H642" stroke="#334934"/>
  <text x="42" y="178" fill="#87957f" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">AI / AUTOMATION / DIGITAL PRODUCTS / SYSTEMS</text>
  <text x="42" y="211" fill="#b8c3b2" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2">A practical route from learning to execution.</text>
</g>

<text x="512" y="1318" text-anchor="middle" fill="#a9b09f" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="7">BY</text>
<text x="512" y="1375" text-anchor="middle" fill="url(#gold)" font-family="Georgia,Times New Roman,serif" font-size="36" letter-spacing="9">MARCO VEX</text>
<path d="M512 1405V1460" stroke="#a57b32" stroke-width="2"/>
<text x="512" y="1482" text-anchor="middle" fill="#61705e" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="4">PRIVATE EDITION / DIGITAL GUIDE</text>
</svg>