  <text x="118" y="784" font-size="20">ANTIPASTI</text><text x="118" y="822" font-size="16">Burrata, heirloom tomato, basil oil</text><text x="880" y="822" text-anchor="end" font-size="16">18</text>
  <text x="118" y="854" font-size="16">Crispy artichoke, lemon, pecorino</text><text x="880" y="854" text-anchor="end" font-size="16">16</text>
  <text x="118" y="914" font-size="20">PASTA</text><text x="118" y="952" font-size="16">Tagliolini, wild mushroom, truffle butter</text><text x="880" y="952" text-anchor="end" font-size="16">24</text>
