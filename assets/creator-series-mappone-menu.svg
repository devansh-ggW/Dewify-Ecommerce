<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" role="img" aria-labelledby="title desc">
<title id="title">MAPPONE — Fine Italian Cuisine</title>
<desc id="desc">Editorial Italian restaurant menu design with a warm paper base, centered emblem, panoramic food photograph treatment and refined menu typography.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f0"/><stop offset="1" stop-color="#efe8da"/></linearGradient>
  <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c3d36"/><stop offset=".45" stop-color="#80604f"/><stop offset=".78" stop-color="#c49a71"/><stop offset="1" stop-color="#e4ca9d"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
